name: Build ArmorPaint

on:
  workflow_dispatch: # Membuat tombol "Run workflow" manual agar bisa diklik kapan saja

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild (Visual Studio)
      uses: microsoft/setup-msbuild@v2

    - name: Generate Solution
      run: node make

    - name: Compile Code
      run: msbuild build/ArmorPaint.sln /p:Configuration=Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-Windows-Binaries
        path: build/krom/
